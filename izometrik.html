<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>İzometrik Silivri (deneme) · Piksel Harita</title>
<meta name="description" content="Silivri merkezinin OpenStreetMap verisinden çizilen izometrik pixel art haritası (deneme sürümü).">
<link rel="icon" href="assets/icon-180.png">
<style>
@font-face { font-family: "Piksel Oyun"; src: url("assets/fonts/pikseloyun.woff2") format("woff2"); font-display: swap; }
:root {
  --sir: #F6F2E9; --murekkep: #19203D; --kobalt: #1B3C8F; --mercan: #D2392C; --turkuaz: #2A9DA6; --soluk: #5A6079;
  --ink: #0F1C47; --ink-2: #182A62; --muted: #AFBBD8;
  --f-game: "Piksel Oyun", "Pixelify Sans", ui-monospace, monospace;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2140; color: var(--murekkep); font-family: var(--f-body); }
#cv { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: grab; }
#cv.drag { cursor: grabbing; }
.hud { position: fixed; z-index: 5; }
.pbtn { font-family: var(--f-game); font-size: 15px; line-height: 1; min-width: 40px; height: 40px; padding: 0 10px; border: 0; background: var(--sir); color: var(--kobalt);
  box-shadow: inset 0 -3px 0 #d9d0bd, 0 0 0 2px var(--kobalt), 3px 3px 0 2px var(--murekkep); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.pbtn:hover { background: #fffaf0; }
.pbtn:active { transform: translate(2px, 2px); box-shadow: inset 0 -3px 0 #d9d0bd, 0 0 0 2px var(--kobalt), 1px 1px 0 2px var(--murekkep); }
.pbtn.on { background: var(--kobalt); color: var(--sir); box-shadow: inset 0 -3px 0 #10286a, 0 0 0 2px var(--kobalt), 3px 3px 0 2px var(--murekkep); }
.pbtn.red { background: var(--mercan); color: var(--sir); box-shadow: inset 0 -3px 0 #9e2a20, 0 0 0 2px #9e2a20, 3px 3px 0 2px var(--murekkep); }
#top { left: 12px; right: 12px; top: 12px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
#top > * { pointer-events: auto; }
#brand { display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--sir); padding: 6px 10px 6px 6px; text-decoration: none;
  box-shadow: 0 0 0 2px var(--kobalt), 3px 3px 0 2px var(--murekkep); font-family: var(--f-game); font-size: 15px; line-height: 1.05; white-space: nowrap; }
#brand img { width: 30px; height: 30px; image-rendering: pixelated; }
#brand b { color: #ff6b5c; font-weight: 400; }
#brand small { display: block; color: #7fd6dc; font-size: 11px; }
#search { position: relative; flex: 1 1 260px; max-width: 360px; }
#q { width: 100%; height: 42px; border: 0; padding: 0 12px 0 30px; font: 15px var(--f-body); background: var(--sir); color: var(--murekkep);
  box-shadow: 0 0 0 2px var(--kobalt), 3px 3px 0 2px var(--murekkep); outline: none; }
#q:focus { box-shadow: 0 0 0 2px var(--turkuaz), 3px 3px 0 2px var(--murekkep); }
#search::before { content: ">"; position: absolute; left: 11px; top: 11px; font-family: var(--f-game); color: var(--mercan); font-size: 16px; }
#res { position: absolute; left: 0; right: 0; top: 48px; background: var(--sir); box-shadow: 0 0 0 2px var(--kobalt), 3px 3px 0 2px var(--murekkep); max-height: 50vh; overflow: auto; }
#res button { display: flex; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: none; padding: 9px 12px; text-align: left; font: 14px var(--f-body); color: var(--murekkep); cursor: pointer; }
#res button:hover, #res button.k { background: #e9e1cf; }
#res small { color: var(--soluk); white-space: nowrap; }
#tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
#ctrl { right: 12px; bottom: 34px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
#ctrl .row { display: flex; gap: 8px; }
#compass { width: 40px; height: 40px; background: var(--ink); box-shadow: 0 0 0 2px var(--kobalt), 3px 3px 0 2px var(--murekkep); display: grid; place-items: center; cursor: pointer; border: 0; padding: 0; }
#compass canvas { image-rendering: pixelated; width: 32px; height: 32px; }
#status { left: 0; right: 0; bottom: 0; height: 24px; background: rgba(15, 28, 71, .88); color: #cdd6f0; font: 12px ui-monospace, "Cascadia Mono", monospace;
  display: flex; gap: 14px; align-items: center; padding: 0 10px; white-space: nowrap; overflow: hidden; }
#status a { color: #7fd6dc; }
#status .sp { flex: 1; }
#badge { left: 12px; bottom: 34px; background: var(--mercan); color: var(--sir); font-family: var(--f-game); font-size: 12px; padding: 5px 8px; box-shadow: 2px 2px 0 var(--murekkep); }
.panel { background: var(--sir); box-shadow: 0 0 0 2px var(--kobalt), 4px 4px 0 2px var(--murekkep); padding: 14px 16px 16px; }
.panel h2 { font-family: var(--f-game); font-weight: 400; font-size: 20px; color: var(--kobalt); margin: 0 26px 6px 0; line-height: 1.15; }
.panel .x { position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; border: 0; background: none; font: 22px var(--f-game); color: var(--mercan); cursor: pointer; }
#info { right: 12px; top: 68px; width: 340px; max-height: calc(100vh - 120px); overflow: auto; }
#info .kind { font-family: var(--f-game); color: var(--turkuaz); font-size: 13px; margin-bottom: 4px; }
dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 14px; }
dt { color: var(--soluk); }
dd { margin: 0; overflow-wrap: anywhere; }
.est { display: inline-block; font: 600 11.5px var(--f-body); background: #f3d9a4; color: #6a4a00; padding: 2px 5px; margin-left: 4px; vertical-align: 1px; }
.real { display: inline-block; font: 600 11.5px var(--f-body); background: #cdeee9; color: #0d5a60; padding: 2px 5px; margin-left: 4px; vertical-align: 1px; }
.note { font-size: 12.5px; color: var(--soluk); margin: 10px 0 0; line-height: 1.45; }
.panel a { color: var(--kobalt); }
#layers { right: 12px; top: 68px; width: 290px; }
#layers label { display: flex; gap: 8px; align-items: center; padding: 5px 0; font-size: 14px; cursor: pointer; }
#layers input { accent-color: var(--kobalt); width: 16px; height: 16px; }
#about { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 80px); overflow: auto; font-size: 14px; line-height: 1.5; }
#about h3 { font: 15px var(--f-game); color: var(--mercan); margin: 14px 0 4px; }
#about table { border-collapse: collapse; width: 100%; font-size: 13px; }
#about td { border-bottom: 1px solid #e2d9c6; padding: 4px 6px 4px 0; vertical-align: top; }
#about td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
#toast { left: 50%; top: 70px; transform: translateX(-50%); background: var(--ink); color: var(--sir); padding: 8px 14px; font: 14px var(--f-body); box-shadow: 0 0 0 2px var(--turkuaz); }
#loading { left: 50%; top: 50%; transform: translate(-50%, -50%); font: 18px var(--f-game); color: var(--sir); background: var(--ink); padding: 14px 18px; box-shadow: 0 0 0 2px var(--kobalt), 4px 4px 0 2px #000; }
[hidden] { display: none !important; }
.lbl { display: inline; }
@media (max-width: 720px) {
  #top { flex-wrap: wrap; left: 8px; right: 8px; top: 8px; gap: 8px; }
  #brand small { display: none; }
  #search { order: 3; flex: 1 1 100%; max-width: none; }
  #tools { gap: 6px; }
  .pbtn { min-width: 38px; height: 38px; padding: 0 8px; font-size: 14px; }
  .lbl { display: none; }
  #info, #layers { left: 8px; right: 8px; top: auto; bottom: 30px; width: auto; max-height: 52vh; }
  #ctrl { right: 8px; bottom: 30px; }
  #badge { left: 8px; bottom: 30px; }
  #status { font-size: 11px; gap: 10px; }
  #status .hm, #sCoord, #sDir { display: none; }
}
</style>
</head>
<body>
<canvas id="cv" aria-label="Silivri merkezinin izometrik piksel haritası"></canvas>

<div id="top" class="hud">
  <a id="brand" href="./" title="Ana haritaya dön"><img src="assets/icon-180.png" alt=""><span>PİKSEL <b>HARİTA</b><small>İzometrik · Silivri (deneme)</small></span></a>
  <div id="search"><input id="q" type="search" placeholder="Silivri'de sokak, bina, yer ara" autocomplete="off" aria-label="Ara"><div id="res" hidden></div></div>
  <div id="tools">
    <button class="pbtn" id="bNight" type="button" title="Gece / gündüz (N)" aria-label="Gece / gündüz">☾<span class="lbl">Gece</span></button>
    <button class="pbtn" id="bLayers" type="button" title="Katmanlar" aria-label="Katmanlar">▤<span class="lbl">Katman</span></button>
    <button class="pbtn" id="bShare" type="button" title="Konumu bağlantı olarak kopyala" aria-label="Konumu paylaş">⤴<span class="lbl">Paylaş</span></button>
    <button class="pbtn" id="bShot" type="button" title="Ekran görüntüsü indir" aria-label="Ekran görüntüsü">▣</button>
    <button class="pbtn red" id="bAbout" type="button" title="Veri kaynakları ve atıf" aria-label="Veri kaynakları">i</button>
  </div>
</div>

<div id="ctrl" class="hud">
  <div class="row"><button class="pbtn" id="bRotL" type="button" title="Sola döndür (Q)" aria-label="Sola döndür">⟲</button><button id="compass" type="button" title="Kuzeyi yukarı al" aria-label="Kuzeyi yukarı al"><canvas id="cmp" width="16" height="16"></canvas></button><button class="pbtn" id="bRotR" type="button" title="Sağa döndür (E)" aria-label="Sağa döndür">⟳</button></div>
  <div class="row"><button class="pbtn" id="bHome" type="button" title="Kamerayı sıfırla" aria-label="Kamerayı sıfırla">⌂</button><button class="pbtn" id="bOut" type="button" title="Uzaklaştır (−)" aria-label="Uzaklaştır">−</button><button class="pbtn" id="bIn" type="button" title="Yakınlaştır (+)" aria-label="Yakınlaştır">+</button></div>
</div>
<div id="badge" class="hud">DENEME<span class="lbl"> · yalnızca Silivri merkezi</span></div>

<aside id="info" class="hud panel" hidden aria-live="polite">
  <button class="x" id="infoX" type="button" aria-label="Kapat">×</button>
  <div class="kind" id="iKind"></div>
  <h2 id="iName"></h2>
  <dl id="iDl"></dl>
  <p class="note" id="iNote"></p>
</aside>

<aside id="layers" class="hud panel" hidden>
  <button class="x" id="layX" type="button" aria-label="Kapat">×</button>
  <h2>Katmanlar</h2>
  <label><input type="checkbox" id="lTrees" checked> Ağaçlar</label>
  <label><input type="checkbox" id="lFurn" checked> Sokak objeleri (OSM noktaları)</label>
  <label><input type="checkbox" id="lMs" checked> Microsoft ML binaları</label>
  <label><input type="checkbox" id="lShadow" checked> Gölgeler</label>
  <label><input type="checkbox" id="lWaves" checked> Deniz animasyonu</label>
  <label><input type="checkbox" id="lEst"> Veri kaynağını renklendir</label>
  <label><input type="checkbox" id="lFoot"> Taban izlerini göster (doğruluk kontrolü)</label>
  <p class="note" id="lLegend"></p>
</aside>

<aside id="about" class="hud panel" hidden>
  <button class="x" id="aboutX" type="button" aria-label="Kapat">×</button>
  <h2>Veri kaynakları ve atıf</h2>
  <div id="aboutBody">Yükleniyor…</div>
</aside>
<div id="toast" class="hud" hidden></div>
<div id="loading" class="hud">Silivri yükleniyor…</div>

<div id="status" class="hud">
  <span id="sCoord"></span><span id="sZoom"></span><span id="sDir"></span><span class="hm" id="sMs"></span><span class="hm" id="sLoad"></span><span class="sp"></span>
  <span>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap katkıcıları</a> · Microsoft <span class="hm">Building Footprints</span> (ODbL)</span>
</div>

<script>
'use strict';
// =====================================================================================
//  İzometrik pixel art çizici (yazılımsal rasterleştirici, 2B canvas + nearest-neighbor)
//  Dünya: yerel metre (x doğu, y kuzey). Görünüm: 2:1 izometri, 4 sabit yön.
//  Ekran (sanat pikseli):  sx = (u − v)·k ,  sy = −(u + v)·k/2 − z·k·ZS
//  Derinlik (görüş ışını boyunca, büyük = uzak):  D = u + v − z/ZS
// =====================================================================================
const BASE = 'data/iso/silivri/';
const ZS = 1.2;                       // dikey ölçek
const CELL = 0.5, GN = 512;           // zemin ızgarası: 0,5 m hücre, 256 m parça
const ZL = [[0.5, 2], [1, 2], [1, 3], [2, 2], [2, 3], [2, 4]];   // [m başına sanat pikseli, sanat pikseli başına CSS pikseli]
const HOME = { lat: 41.07395, lon: 28.24760 };
const cv = document.getElementById('cv'), ctx = cv.getContext('2d', { alpha: false });
const $ = id => document.getElementById(id);

let META = null, SRC = null, SEARCH = null;
let R_, KC, LON0, LAT0, MY0, WW = 0, WH = 0;
const cam = { x: 0, y: 0, zi: 2, r: 0 };
const opt = { trees: true, furn: true, ms: true, shadow: true, waves: true, est: false, foot: false };
let night = 0, nightTarget = 0, wavePhase = 0, selected = null, dirty = true;
let W = 0, H = 0, PX = 3, k = 1;
let img = null, col = null, dep = null, ids = null, fid = null, emis = null, smask = null;
let frameB = [], lastMs = 0, frameCount = 0, prof = {}, outBuf = null;

function mercY(lat) { const s = Math.sin(lat * Math.PI / 180); return R_ * 0.5 * Math.log((1 + s) / (1 - s)); }
function toM(lon, lat) { return [R_ * (lon - LON0) * Math.PI / 180 * KC, (mercY(lat) - MY0) * KC]; }
function toLL(x, y) { return [LON0 + (x / KC / R_) * 180 / Math.PI, (2 * Math.atan(Math.exp((y / KC + MY0) / R_)) - Math.PI / 2) * 180 / Math.PI]; }

// ---------- renk yardımcıları ----------
const pk = (r, g, b) => ((255 << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255)) >>> 0;
const cr = c => c & 255, cg = c => (c >>> 8) & 255, cb = c => (c >>> 16) & 255;
function hex(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
// renk kaydırmalı ton: t>0 sıcak/aydınlık, t<0 soğuk/mor gölge
function tone(c, t) {
  let r = c[0], g = c[1], b = c[2];
  if (t >= 0) { const a = t * 0.38; r += (255 - r) * a; g += (240 - g) * a; b += (196 - b) * a * 0.8; }
  else { const a = -t; r = r * (1 - a * 0.40) + 8 * a; g = g * (1 - a * 0.40) + 8 * a; b = b * (1 - a * 0.33) + 22 * a; }
  return pk(Math.round(r), Math.round(g), Math.round(b));
}
function tonePk(c, t) { return tone([cr(c), cg(c), cb(c)], t); }
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; }
function hashS(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const CSS_COL = { white: '#f2f0ea', black: '#2a2a2a', grey: '#9a9a9a', gray: '#9a9a9a', red: '#b5483a', brown: '#8a5a3c', yellow: '#e8d27a', beige: '#e3d6b4',
  orange: '#d98a4a', blue: '#5a7fb5', green: '#6d9a5a', pink: '#e7b3b0', cream: '#f0e6c8', maroon: '#7a2e2a', silver: '#c0c4c8', darkgrey: '#5a5a5a', lightgrey: '#cfcfcf' };
function tagColor(v) { if (!v) return null; v = String(v).trim().toLowerCase(); if (/^#?[0-9a-f]{6}$|^#?[0-9a-f]{3}$/.test(v)) return hex(v); return CSS_COL[v] ? hex(CSS_COL[v]) : null; }

// ---------- zemin paleti (gerçekçi tonlar) ----------
// 0..19 veri sınıfları (meta.gcls), 20+ yol/çizgi yüzeyleri
const GROUND = {
  0: ['#b4ae88', '#aca680', '#bbb591'], 1: ['#2f6f9e'], 2: ['#e2cd96', '#dac38a', '#e8d6a2'], 3: ['#7fa955', '#77a04e', '#86b05c'], 4: ['#6ea24a', '#669a43', '#79ab53'],
  5: ['#4c8240', '#467a3a', '#538a46'], 6: ['#8d9a58', '#859253', '#95a25f'], 7: ['#b7ab68', '#ada160'], 8: ['#c9c0aa', '#c2b9a2', '#cec6b1'], 9: ['#c3bdb4', '#bcb6ad'],
  10: ['#aeaaa0', '#a6a298'], 11: ['#cdbd98', '#c6b690'], 12: ['#7c9a64', '#74925d'], 13: ['#5aa45c', '#529a54'], 14: ['#8a8b90', '#84858a'], 15: ['#d2c6ad', '#c9bda4'],
  16: ['#9a7650', '#8c6a47'], 17: ['#b09a7a', '#a89272'], 18: ['#6f9575', '#678d6d'], 19: ['#97a07a', '#8f9873'],
  20: ['#cdc8bc', '#c3beb2'], 21: ['#50535c', '#555861', '#4c4f57'], 22: ['#62646b', '#676970', '#5e6067'], 23: ['#c2bcad', '#b4ae9f'], 24: ['#d8c9a6', '#d0c19e'],
  25: ['#ae9369', '#a68b62'], 26: ['#7b726a', '#736a62'], 27: ['#4a4440'], 28: ['#eceade'], 29: ['#e9c14b'], 30: ['#a9a69c'], 31: ['#9a7650', '#8a6744'],
  32: ['#d6cbb2', '#cbbfa6'], 34: ['#3d80a8'], 35: ['#988b76'], 36: ['#6c7a52'], 37: ['#a86458', '#a05d52']
};
const GP = {}; for (const kk in GROUND) GP[kk] = GROUND[kk].map(h => { const c = hex(h); return pk(c[0], c[1], c[2]); });
const VOID = [pk(26, 33, 64), pk(30, 38, 72)];

// ---------- bina renkleri (stilize; OSM building:colour / roof:colour varsa o kullanılır) ----------
const WALLS = {
  generic: ['#e9dfc8', '#e4d3b0', '#efe6d2', '#dcd3c3', '#e8cfb2', '#f0e2c0', '#d9d4ca'],
  apart: ['#efe5cf', '#e9d6b0', '#f1dfc9', '#dfd8cc', '#ecd2b6', '#f2e6b8', '#e2e0d8', '#e6c9a8'],
  house: ['#f2ede2', '#efe0c2', '#f0d7c0', '#e8e2d2', '#f3e7c6'],
  comm: ['#d8dadc', '#cfd5da', '#e2ddd2', '#c9ced6'], ind: ['#b9c0c6', '#aeb6bd', '#c4c4bc', '#a9b4b8'],
  mosque: ['#ece4d0'], church: ['#e7dcc4'], historic: ['#d9c49a', '#d2bb8e'], public: ['#efe1bf', '#e7d9be', '#f0e6d6'], transport: ['#cdd2d6'],
  roof: ['#a7a9a8'], ruins: ['#b8a585', '#ad9a7c'], tower: ['#e0d8c8']
};
const ROOFC = { tile: ['#b9573c', '#c0603f', '#a84e36', '#b5643f', '#9f4a35'], flat: ['#a9a49a', '#b3aea3', '#9e9a92', '#bab4a8'], ind: ['#c9cdd0', '#b8bec2', '#9fa8ad'], dome: ['#8796a3'] };
const BL = {
  generic: 'Bina (türü belirtilmemiş)', house: 'Müstakil ev / küçük yapı', apart: 'Apartman / konut', comm: 'Ticari bina', ind: 'Sanayi / depo', mosque: 'Cami',
  church: 'Kilise / ibadethane', historic: 'Tarihî yapı', public: 'Kamu / eğitim / sağlık', transport: 'Ulaşım yapısı', roof: 'Sundurma / çatı', ruins: 'Harabe', tower: 'Kule'
};
const ROOFN = ['düz', 'kırma', 'beşik', 'piramit', 'kubbe', 'tek eğimli'];

// =====================================================================================
//  Parça yükleme
// =====================================================================================
const chunks = new Map();        // "i_j" -> {state, b:[], g:{cls,wd}, p:[]}
let inflight = 0;
async function fetchRetry(url, tries = 3) {
  for (let t = 0; t < tries; t++) {
    try {
      const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), 15000);
      const r = await fetch(url, { signal: ac.signal }); clearTimeout(tm);
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch (e) { if (t === tries - 1) throw e; await new Promise(r => setTimeout(r, 600 * (t + 1))); }
  }
}
function wantChunk(i, j) {
  const key = i + '_' + j; let c = chunks.get(key);
  if (c) { c.used = frameCount; return c; }
  if (!META.has.has(key)) { c = { state: 'empty', b: [], p: [], g: null, used: frameCount }; chunks.set(key, c); return c; }
  c = { state: 'loading', b: [], p: [], g: null, used: frameCount, i, j };
  chunks.set(key, c); inflight++;
  fetchRetry(BASE + 'c/' + key + '.json').then(d => { buildChunk(c, d); c.state = 'ok'; })
    .catch(() => { c.state = 'fail'; setTimeout(() => chunks.delete(key), 5000); })
    .finally(() => { inflight--; dirty = true; });
  return c;
}

function buildChunk(c, d) {
  const ox = c.i * META.chunk, oy = c.j * META.chunk;
  c.raw = d;

  const c = document.createElement('canvas'); c.width = W * PX; c.height = H * PX; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(cv, 0, 0, c.width, c.height);
  g.fillStyle = 'rgba(15,28,71,.8)'; g.fillRect(0, c.height - 22, c.width, 22); g.fillStyle = '#F6F2E9'; g.font = '12px sans-serif';
  g.fillText('pikselharita.com · © OpenStreetMap katkıcıları (ODbL) · Microsoft Building Footprints (ODbL)', 8, c.height - 7);
  c.toBlob(bl => { const a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = 'pikselharita-silivri.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
};
for (const [id, key] of [['lTrees', 'trees'], ['lFurn', 'furn'], ['lMs', 'ms'], ['lShadow', 'shadow'], ['lWaves', 'waves'], ['lEst', 'est'], ['lFoot', 'foot']])
  $(id).onchange = e => { opt[key] = e.target.checked; dirty = true; legend(); };
function legend() {
  $('lLegend').innerHTML = opt.est ? '<b style="color:#2a8f87">■</b> yüksekliği OSM\'den &nbsp; <b style="color:#d8a43a">■</b> yüksekliği tahmini &nbsp; <b style="color:#9b6fc0">■</b> Microsoft ML binası'
    : 'Ağaçların bir kısmı park/orman sınırı içinde stilize yerleştirilmiştir; sokak objeleri yalnızca OSM\'de işaretli olanlardır.';
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const step = 40 / k;
  if (e.key === '+' || e.key === '=') setZoom(Math.min(ZL.length - 1, cam.zi + 1));
  else if (e.key === '-') setZoom(Math.max(0, cam.zi - 1));
  else if (e.key === 'q' || e.key === 'Q') rotate(-1); else if (e.key === 'e' || e.key === 'E') rotate(1);
  else if (e.key === 'n' || e.key === 'N') $('bNight').click();
  else if (e.key.startsWith('Arrow')) {
    const sx = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0, sy = e.key === 'ArrowUp' ? -1 : e.key === 'ArrowDown' ? 1 : 0;
    const A = sx * step, B = -2 * sy * step / 2, du = (A + B) / 2, dv = (B - A) / 2;
    cam.x += RC * du - RS * dv; cam.y += RS * du + RC * dv; clampCam(); dirty = true; writeHash();
  } else if (e.key === 'Escape') { selected = null; $('info').hidden = true; $('about').hidden = true; $('layers').hidden = true; dirty = true; }
});
addEventListener('resize', resize);
addEventListener('hashchange', () => { if (readHash()) { spriteCache.clear(); resize(); } });

// ---------- döngü ----------
let lastWave = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (!META) return;
  if (Math.abs(night - nightTarget) > 0.001) { night += Math.sign(nightTarget - night) * Math.min(Math.abs(nightTarget - night), 0.06); dirty = true; }
  if (opt.waves && t - lastWave > 650 && !drag && lastMs < 45) { lastWave = t; wavePhase = (wavePhase + 1) % 2300; dirty = true; }
  if (!dirty) return;
  dirty = false;
  try { render(); } catch (err) { console.error(err); }
  // kullanılmayan zemin ızgaralarını boşalt
  if (chunks.size > 140) for (const [key, c] of chunks) if (frameCount - c.used > 120) chunks.delete(key);
}

async function init() {
  try {
    [META, SRC] = await Promise.all([fetchRetry(BASE + 'meta.json'), fetchRetry(BASE + 'sources.json')]);
  } catch (e) { $('loading').textContent = 'Veri yüklenemedi. Sayfayı yenileyin.'; return; }
  const pj = META.projection; R_ = pj.R; KC = Math.cos(pj.latc * Math.PI / 180); LON0 = pj.lon0; LAT0 = pj.lat0; MY0 = mercY(LAT0);
  META.nx = Math.ceil(META.size[0] / META.chunk); META.ny = Math.ceil(META.size[1] / META.chunk);
  META.has = new Set(META.chunks.map(c => c[0] + '_' + c[1]));
  if (!readHash()) home(); else resize();
  legend(); aboutPanel();
  $('loading').hidden = true;
  fetchRetry(BASE + 'search.json').then(s => { SEARCH = s.map(r => ({ r, n: norm(r[0]) })); }).catch(() => {});
  requestAnimationFrame(loop);
}
function aboutPanel() {
  const s = META.stats, hs = s.height_src, tr = s.trees, tot = s.buildings || 1, pc = n => fmt(n / tot * 100, 1) + '%';
  $('sMs').textContent = '';
  $('aboutBody').innerHTML = `
  <p>Bu sayfa PikselHarita'nın <b>izometrik deneme</b> sürümüdür ve yalnızca <b>Silivri merkezini</b> (boylam ${META.bbox[0]}–${META.bbox[2]}, enlem ${META.bbox[1]}–${META.bbox[3]}) kapsar. Kapsam dışı koyu ızgara ile gösterilir; boş yerler hayalî yapılarla doldurulmaz.</p>
  <h3>Kaynaklar</h3>
  <p><b>${esc(SRC.osm.attribution)}</b> — <a href="${SRC.osm.url}" target="_blank" rel="noopener">ODbL 1.0</a>. Dosya: ${esc(SRC.osm.file)}, veri tarihi ${esc(SRC.osm.data_timestamp || '?')}.<br>
  <b>Microsoft Global ML Building Footprints</b> — <a href="${SRC.microsoft.url}" target="_blank" rel="noopener">ODbL 1.0</a>, sürüm ${esc(SRC.microsoft.release)}. ${esc(SRC.microsoft.rule)}</p>
  <h3>Bu bölgedeki veri durumu</h3>
  <table>
   <tr><td>Toplam bina</td><td>${fmt(s.buildings, 0)}</td></tr>
   <tr><td>OSM binası</td><td>${fmt(s.osm_buildings, 0)}</td></tr>
   <tr><td>Microsoft ML ile eklenen (OSM'de olmayan)</td><td>${fmt(s.ms_buildings != null ? s.ms_buildings : s.ms.eklenen, 0)}</td></tr>
   <tr><td>Microsoft binası, OSM ile örtüştüğü için eklenmedi</td><td>${fmt(s.ms.osm_ile_ortusen, 0)}</td></tr>
   <tr><td>Yüksekliği OSM'de (height)</td><td>${fmt(hs.osm_height, 0)} (${pc(hs.osm_height)})</td></tr>
   <tr><td>Kat sayısı OSM'de (building:levels)</td><td>${fmt(hs.osm_levels, 0)} (${pc(hs.osm_levels)})</td></tr>
   <tr><td>Yüksekliği <b>tahmini</b> (türe ve alana göre)</td><td>${fmt(hs.tahmin + hs.ms_tahmin, 0)} (${pc(hs.tahmin + hs.ms_tahmin)})</td></tr>
   <tr><td>Çatı şekli OSM'de</td><td>${fmt(s.roof_src.osm, 0)}</td></tr>
   <tr><td>Ağaç: OSM tekil / OSM ağaç sırası / stilize</td><td>${fmt(tr.osm, 0)} / ${fmt(tr.osm_sira, 0)} / ${fmt(tr.stilize, 0)}</td></tr>
  </table>
  <h3>Neler gerçek, neler stilize?</h3>
  <p><b>Gerçek:</b> bina konumları ve taban şekilleri, yollar, kıyı çizgisi, park ve alan sınırları, OSM'de işaretli ağaçlar, lambalar, banklar, duraklar, yaya geçitleri ve minareler (konum).<br>
  <b>Stilize / tahmin:</b> etiketi olmayan binaların kat ve yüksekliği, çatı şekli ve rengi, cephe rengi, pencere/balkon desenleri, çatıdaki güneş enerjili ısıtıcılar, park içindeki ağaçların yeri, kaldırım genişlikleri, minare yüksekliği, gece pencere ışıkları ve deniz animasyonu.</p>
  <p class="note">Hesaplama: ${esc(SRC.built)} · Projeksiyon: Web Mercator, ${fmt(META.projection.latc, 3)}° enleminde gerçek metreye ölçeklenmiş. <a href="./">Ana haritaya dön</a></p>`;
}
// test kancaları
window.ISO = { cam, opt, get ms() { return lastMs; }, get prof() { return prof; }, get frameB() { return frameB; }, chunks, render: () => { render(); return lastMs; }, setZoom, rotate,
  toM, toLL, pickAt: (x, y) => { const id = ids[y * W + x]; return id >= 0 ? frameB[id].ref : null; }, depthAt: (x, y) => dep[y * W + x],
  depthOf: (x, y, z) => { setupFrame(); const u = RC * x + RS * y, v = -RS * x + RC * y; return u + v - z / ZS; },
  projectWorld: (x, y, z) => { setupFrame(); const u = RC * x + RS * y, v = -RS * x + RC * y; return [projX(u, v), projY(u, v, z)]; },
  get size() { return [W, H, PX, k]; }, get pixels() { return col; }, get inflight() { return inflight; }, set night(v) { night = nightTarget = v; dirty = true; },
  set waves(v) { opt.waves = v; } };
init();
</script>
</body>
</html>
